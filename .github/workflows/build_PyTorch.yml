name: Build PyTorch and TorchVision and Deploy

on:
  workflow_dispatch:
    inputs:
      rocm_version:
        type: string
        description: Rocm Version
        default: 5.7.1

jobs:
  build_and_deploy:
    name: Build PyTorch and PyTorchVision
    runs-on: ubuntu-latest
    env: 
      HSA_OVERRIDE_GFX_VERSION: 8.0.3
      PYTORCH_ROCM_ARCH: gfx803
      ROC_ENABLE_PRE_VEGA: 1
      USE_CUDA: 0
      USE_ROCM: 1
      USE_NINJA: 1
      FORCE_CUDA: 1
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup RocM
        uses: neoblizz/rocm-setup@v0.1.0-beta
        with:
          rocm: ${{github.event.inputs.rocm_version}}

      - name: Checkout Repository
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  

      - name: Upgrade Pip and Install mkl
        run: |
              pip install --upgrade pip
              pip install cmake mkl mkl-include
              pip install --upgrade pip wheel

      - name: Checkout PyTorch
        uses: actions/checkout@v2
        with:
          repository: 'pytorch/pytorch'
          ref: 'release/2.0'
          path: /pytorch

      - name: Build PyTorch
        working-directory: /pytorch
        run: | 
          export USE_ROCM=1
          USE_ROCM=1 python setup.py clean
          pip install -r requirements.txt
          python tools/amd_build/build_amd.py
          python setup.py bdist_wheel
          mv /pytorch/dist/torch* /artifacts
          
      - name: Checkout PyTorchVision
        uses: actions/checkout@v2
        with:
          repository: 'pytorch/vision'
          ref: 'release/0.15'
          path: /pytorch

      - name: Build PyTorchVision
        working-directory: /vision
        run: | 
          export USE_ROCM=1
          python3 setup.py bdist_wheel
          RUN mv /vision/dist/torchvision-* /artifacts
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v2
        with:
          name: generated_files
          path: ./artifacts
