name: Build PyTorch and TorchVision and Deploy

on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build PyTorch and PyTorchVision
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: rocm-setup
        uses: neoblizz/rocm-setup@v0.1.0-beta
        with:
          rocm: '5.7.1'

      - name: Checkout Repository
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  

      -  run: |
              pip install cmake mkl mkl-include
              pip install --upgrade pip wheel

      - name: Checkout PyTorch
        uses: actions/checkout@v2
        with:
          repository: 'pytorch/pytorch'
          ref: 'release/2.1'
          path: /pytorch

      - name: Build PyTorch
        working-directory: /pytorch
        run: | 
          python setup.py clean
          pip install -r requirements.txt
          python tools/amd_build/build_amd.py
          export PYTORCH_BUILD_VERSION
          
    
      - name: Build Docker Image
        run: docker build -t "build:latest" .
            
      - name: Start Docker Container
        run: |
          docker run -d --name build_run build:latest
          
      - name: Extract Files from Container
        run: |
          mkdir artifacts
          docker cp build_run:/artifacts ./artifacts
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v2
        with:
          name: generated_files
          path: ./artifacts
